e":"作成者ID","type":"uuid","required":true,"description":"レポートを生成したユーザー"},{"name":"作成日時","type":"timestamp","required":true,"description":"レポート生成開始日時"},{"name":"完了日時","type":"timestamp","required":false,"description":"レポート生成完了日時"}]},{"tableName":"操作履歴","purpose":"システム内でのユーザー操作を記録し、監査証跡とセキュリティ管理を提供する","columns":[{"name":"操作履歴ID","type":"uuid","required":true,"description":"操作履歴の一意識別子"},{"name":"ユーザーID","type":"uuid","required":true,"description":"操作を実行したユーザーの識別子"},{"name":"操作種別","type":"varchar(100)","required":true,"description":"実行された操作の種類（作成/更新/削除/参照/ログイン/ログアウト等）"},{"name":"対象テーブル","type":"varchar(100)","required":false,"description":"操作対象となったテーブル名"},{"name":"対象レコードID","type":"varchar(100)","required":false,"description":"操作対象となったレコードの識別子"},{"name":"操作内容","type":"text","required":false,"description":"操作の詳細内容や変更前後の値"},{"name":"IPアドレス","type":"varchar(100)","required":false,"description":"操作元のIPアドレス"},{"name":"ユーザーエージェント","type":"text","required":false,"description":"操作に使用されたブラウザやアプリケーション情報"},{"name":"実行結果","type":"varchar(100)","required":true,"description":"操作の実行結果（成功/失敗/エラー等）"},{"name":"エラーメッセージ","type":"text","required":false,"description":"操作失敗時のエラー詳細"},{"name":"操作日時","type":"timestamp","required":true,"description":"操作が実行された日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  // 統合結果プレビュー再描画関数\n  function renderIntegrationPreview(data) {\n    const tbody = container.querySelector('#integration-preview-tbody');\n    if (!data || data.length === 0) {\n      tbody.innerHTML = '<tr><td colspan=\"4\" style=\"text-align: center; color: var(--text-muted); padding: 20px;\">統合データがありません</td></tr>';\n      return;\n    }\n    \n    tbody.innerHTML = data.slice(0, 10).map(item => `\n      <tr>\n        <td>${item.生産開始日時 ? new Date(item.生産開始日時).toLocaleDateString() : '-'}</td>\n        <td>${item.ライン名 || '-'}</td>\n        <td>${item.製品名 || '-'}</td>\n        <td>${item.生産数量 || 0}</td>\n      </tr>\n    `).join('');\n  }\n\n  // 初期データ読み込み\n  Promise.all([\n    window.aivicApi.list(4), // 生産実績\n    window.aivicApi.list(1)  // 生産ライン\n  ]).then(([productionData, lineData]) => {\n    // 生産ライン選択肢を動的生成\n    const linesContainer = container.querySelector('#production-lines');\n    if (lineData && lineData.length > 0) {\n      linesContainer.innerHTML = lineData.map(line => `\n        <label style=\"display: block; margin-bottom: 4px; font-size: 13px; color: var(--text);\">\n          <input type=\"checkbox\" value=\"${line.生産ラインID}\" style=\"margin-right: 6px; accent-color: var(--primary);\">\n          ${line.ライン名} - ${line.場所 || ''}\n        </label>\n      `).join('');\n    }\n  });\n\n  // データ統合実行\n  container.querySelector('#integration-execute-btn').addEventListener('click', async () => {\n    const dataSource = container.querySelector('#data-source-select').value;\n    const startDate = container.querySelector('#start-date').value;\n    const endDate = container.querySelector('#end-date').value;\n    const selectedLines = Array.from(container.querySelectorAll('#production-lines input:checked')).map(cb => cb.value);\n    const productCategory = container.querySelector('#product-category-select').value;\n\n    if (!dataSource) {\n      alert('データソースを選択してください');\n      return;\n    }\n\n    // プログレスバー表示\n    const progressDiv = container.querySelector('#integration-progress');\n    const progressBar = container.querySelector('#progress-bar');\n    const progressText = container.querySelector('#progress-text');\n    \n    progressDiv.style.display = 'block';\n    \n    // 進捗シミュレーション\n    let progress = 0;\n    const progressInterval = setInterval(() => {\n      progress += Math.random() * 20;\n      if (progress > 100) progress = 100;\n      \n      progressBar.style.width = progress + '%';\n      progressText.textContent = Math.round(progress) + '%';\n      \n      if (progress >= 100) {\n        clearInterval(progressInterval);\n        // 統合完了後にデータ取得\n        loadIntegratedData();\n      }\n    }, 200);\n\n    async function loadIntegratedData() {\n      try {\n        const productionData = await window.aivicApi.list(4); // 生産実績\n        const productData = await window.aivicApi.list(2);    // 製品\n        const lineData = await window.aivicApi.list(1);       // 生産ライン\n\n        // データ統合処理（簡易版）\n        const integratedData = productionData.map(prod => {\n          const product = productData.find(p => p.製品ID === prod.製品ID);\n          const line = lineData.find(l => l.生産ラインID === prod.生産ラインID);\n          \n          return {\n            ...prod,\n            製品名: product?.製品名 || '不明',\n            ライン名: line?.ライン名 || '不明'\n          };\n        }).filter(item => {\n          // フィルタリング\n          if (selectedLines.length > 0 && !selectedLines.includes(item.生産ラインID)) return false;\n          if (productCategory && item.カテゴリ !== productCategory) return false;\n          if (startDate && new Date(item.生産開始日時) < new Date(startDate)) return false;\n          if (endDate && new Date(item.生産開始日時) > new Date(endDate)) return false;\n          return true;\n        });\n\n        renderIntegrationPreview(integratedData);\n      } catch (error) {\n        console.error('データ統合エラー:', error);\n        alert('データ統合中にエラーが発生しました');\n      }\n    }\n  });\n\n  // 分析実行\n  container.querySelector('#analysis-execute-btn').addEventListener('click', async () => {\n    const analysisType = container.querySelector('input[name=\"analysis-type\"]:checked')?.value;\n    \n    if (!analysisType) {\n      alert('分析種別を選択してください');\n      return;\n    }\n\n    try {\n      const productionData = await window.aivicApi.list(4);\n      \n      // チャート描画\n      const canvas = container.querySelector('#analysis-chart');\n      const ctx = canvas.getContext('2d');\n      const placeholder = container.querySelector('#chart-placeholder');\n      \n      placeholder.style.display = 'none';\n      \n      // キャンバスクリア\n      ctx.clearRect(0, 0, canvas.width, canvas.height);\n      \n      // 簡易チャート描画\n      drawAnalysisChart(ctx, productionData, analysisType);\n      \n    } catch (error) {\n      console.error('分析実行エラー:', error);\n      alert('分析実行中にエラーが発生しました');\n    }\n  });\n\n  // チャート描画関数\n  function drawAnalysisChart(ctx, data, analysisType) {\n    const width = ctx.canvas.width;\n    const height = ctx.canvas.height;\n    const padding = 40;\n    \n    // 背景\n    ctx.fillStyle = '#1a2332';\n    ctx.fillRect(0, 0, width, height);\n    \n    // グリッド線\n    ctx.strokeStyle = '#3a4a5c';\n    ctx.lineWidth = 1;\n    \n    // 縦線\n    for (let i = 1; i < 5; i++) {\n      const x = padding + (width - padding * 2) * i / 5;\n      ctx.beginPath();\n      ctx.moveTo(x, padding);\n      ctx.lineTo(x, height - padding);\n      ctx.stroke();\n    }\n    \n    // 横線\n    for (let i = 1; i < 4; i++) {\n      const y = padding + (height - padding * 2) * i / 4;\n      ctx.beginPath();\n      ctx.moveTo(padding, y);\n      ctx.lineTo(width - padding, y);\n      ctx.stroke();\n    }\n    \n    // データポイント描画\n    if (data && data.length > 0) {\n      ctx.fillStyle = '#4a9eff';\n      ctx.strokeStyle = '#4a9eff';\n      ctx.lineWidth = 2;\n      \n      const points = data.slice(0, 10).map((item, index) => ({\n        x: padding + (width - padding * 2) * index / 9,\n        y: padding + (height - padding * 2) * (1 - (item.生産数量 || 0) / 1000)\n      }));\n      \n      // 線グラフ\n      ctx.beginPath();\n      points.forEach((point, index) => {\n        if (index === 0) {\n          ctx.moveTo(point.x, point.y);\n        } else {\n          ctx.lineTo(point.x, point.y);\n        }\n      });\n      ctx.stroke();\n      \n      // ポイント\n      points.forEach(point => {\n        ctx.beginPath();\n        ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);\n        ctx.fill();\n      });\n    }\n    \n    // タイトル\n    ctx.fillStyle = '#d0e4ff';\n    ctx.font = '14px sans-serif';\n    ctx.textAlign = 'center';\n    ctx.fillText(getAnalysisTitle(analysisType), width / 2, 25);\n  }\n\n  function getAnalysisTitle(type) {\n    const titles = {\n      trend: '生産トレンド分析',\n      efficiency: '稼働効率分析', \n      quality: '品質分析',\n      comparison: '計画対実績比較'\n    };\n    return titles[type] || '分析結果';\n  }\n\n  // レポート生成\n  container.querySelector('#generate-report-btn').addEventListener('click', async () => {\n    const format = container.querySelector('#report-format-select').value;\n    \n    if (!format) {\n      alert('出力形式を選択してください');\n      return;\n    }\n\n    try {\n      const reportData = {\n        レポート名: `データ統合分析レポート_${new Date().toISOString().split('T')[0]}`,\n        レポート種別: 'データ統合分析',\n        対象期間開始: container.querySelector('#start-date').value || new Date().toISOString(),\n        対象期間終了: container.querySelector('#end-date').value || new Date().toISOString(),\n        ファイル形式: format.toUpperCase(),\n        ステータス: '生成完了',\n        作成者ID: 'current-user-id'\n      };\n\n      const saved = await window.aivicApi.save(6, reportData); // 生成レポートテーブル\n      \n      if (saved) {\n        alert(`${format.toUpperCase()}レポートを生成しました`);\n      } else {\n        alert('レポート生成に失敗しました');\n      }\n    } catch (error) {\n      console.error('レポート生成エラー:', error);\n      alert('レポート生成中にエラーが発生しました');\n    }\n  });\n\n  // 初期日付設定\n  const today = new Date();\n  const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, today.getDate());\n  \n  container.querySelector('#start-date').value = lastMonth.toISOString().split('T')[0];\n  container.querySelector('#end-date').value = today.toISOString().split('T')[0];\n}";
</script>

(function() {

    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");

      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }

        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）

  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;

    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;

    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;

  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
