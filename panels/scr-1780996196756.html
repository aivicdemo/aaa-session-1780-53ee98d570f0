window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const tbody = container.querySelector(\"#request-tbody\");\n  \n  // 1. テーブル再描画関数を定義\n  function renderRows(rows) {\n    tbody.innerHTML = rows.map(r => `\n      <tr data-id=\"${r.id || ''}\" style=\"cursor: pointer; border-bottom: 1px solid var(--border);\" \n          onmouseover=\"this.style.background='rgba(255,255,255,0.03)'\" \n          onmouseout=\"this.style.background='transparent'\">\n        <td style=\"padding: 10px 12px; color: var(--text);\">${r.要求ID || r.id || ''}</td>\n        <td style=\"padding: 10px 12px; color: var(--text);\">${r.顧客名 || r.customerName || ''}</td>\n        <td style=\"padding: 10px 12px; color: var(--text);\">${r.製品名 || r.productName || ''}</td>\n        <td style=\"padding: 10px 12px; color: var(--text);\">${r.数量 || r.quantity || ''}</td>\n        <td style=\"padding: 10px 12px; color: var(--text);\">${r.希望納期 || r.deliveryDate || ''}</td>\n        <td style=\"padding: 10px 12px;\">\n          <span style=\"padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; \n                       background: ${getStatusColor(r.ステータス || r.status)}; color: #fff;\">\n            ${r.ステータス || r.status || ''}\n          </span>\n        </td>\n        <td style=\"padding: 10px 12px; color: var(--text);\">${r.担当営業 || r.salesPerson || ''}</td>\n        <td style=\"padding: 10px 12px;\">\n          <button class=\"edit-btn action-btn secondary\" data-id=\"${r.id || ''}\" \n                  style=\"padding: 4px 8px; margin-right: 4px; background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); border-radius: 3px; font-size: 11px; cursor: pointer;\">\n            編集\n          </button>\n          <button class=\"delete-btn action-btn secondary\" data-id=\"${r.id || ''}\" \n                  style=\"padding: 4px 8px; background: transparent; color: #ff6b6b; border: 1px solid #ff6b6b; border-radius: 3px; font-size: 11px; cursor: pointer;\">\n            削除\n          </button>\n        </td>\n      </tr>\n    `).join(\"\");\n  }\n\n  function getStatusColor(status) {\n    switch(status) {\n      case '新規': return '#3b82f6';\n      case '検討中': return '#f59e0b';\n      case '見積済み': return '#8b5cf6';\n      case '受注': return '#10b981';\n      case '失注': return '#ef4444';\n      default: return '#6b7280';\n    }\n  }\n\n  // 2. 初期データを即座に描画\n  renderRows(tables[0]?.records || []);\n\n  // 3. 検索ボタンのイベントリスナー\n  container.querySelector(\"#btn-search\").addEventListener(\"click\", async () => {\n    const customerSearch = container.querySelector(\"#customer-search\").value.toLowerCase();\n    const statusFilter = container.querySelector(\"#status-filter\").value;\n    const salesFilter = container.querySelector(\"#sales-filter\").value;\n    \n    const rows = await window.aivicApi.list(0);\n    if (rows) {\n      const filtered = rows.filter(r => {\n        const matchCustomer = !customerSearch || (r.顧客名 || r.customerName || '').toLowerCase().includes(customerSearch);\n        const matchStatus = !statusFilter || (r.ステータス || r.status) === statusFilter;\n        const matchSales = !salesFilter || (r.担当営業 || r.salesPerson) === salesFilter;\n        return matchCustomer && matchStatus && matchSales;\n      });\n      renderRows(filtered);\n    }\n  });\n\n  // 4. 保存ボタンのイベントリスナー\n  container.querySelector(\"#btn-save\").addEventListener(\"click\", async (e) => {\n    e.preventDefault();\n    \n    const editId = container.querySelector(\"#edit-id\").value;\n    const customerName = container.querySelector(\"#customer-select\").value;\n    const productName = container.querySelector(\"#product-select\").value;\n    const quantity = container.querySelector(\"#quantity-input\").value;\n    const deliveryDate = container.querySelector(\"#delivery-date\").value;\n    const status = container.querySelector(\"#status-select\").value;\n    const salesPerson = container.querySelector(\"#sales-select\").value;\n    const notes = container.querySelector(\"#notes-input\").value;\n\n    if (!customerName || !productName || !quantity || !deliveryDate || !status || !salesPerson) {\n      alert(\"必須項目を入力してください\");\n      return;\n    }\n\n    const data = {\n      顧客名: customerName,\n      customerName: customerName,\n      製品名: productName,\n      productName: productName,\n      数量: parseInt(quantity),\n      quantity: parseInt(quantity),\n      希望納期: deliveryDate,\n      deliveryDate: deliveryDate,\n      ステータス: status,\n      status: status,\n      担当営業: salesPerson,\n      salesPerson: salesPerson,\n      備考: notes,\n      notes: notes,\n      要求ID: editId || `REQ-${Date.now()}`,\n      id: editId || undefined\n    };\n\n    let result;\n    if (editId) {\n      result = await window.aivicApi.update(0, editId, data);\n    } else {\n      result = await window.aivicApi.save(0, data);\n    }\n\n    if (result) {\n      const rows = await window.aivicApi.list(0);\n      if (rows) renderRows(rows);\n      \n      // フォームクリア\n      container.querySelector(\"#request-form\").reset();\n      container.querySelector(\"#edit-id\").value = \"\";\n    }\n  });\n\n  // 5. クリアボタン\n  container.querySelector(\"#btn-clear\").addEventListener(\"click\", () => {\n    container.querySelector(\"#request-form\").reset();\n    container.querySelector(\"#edit-id\").value = \"\";\n  });\n\n  // 6. 行レベル操作のイベントデリゲーション\n  container.addEventListener(\"click\", async (e) => {\n    // 削除ボタン\n    const deleteBtn = e.target.closest(\".delete-btn\");\n    if (deleteBtn) {\n      if (!confirm(\"この要求を削除しますか？\")) return;\n      \n      const id = deleteBtn.dataset.id;\n      await window.aivicApi.delete(0, id);\n      \n      const rows = await window.aivicApi.list(0);\n      if (rows) renderRows(rows);\n      return;\n    }\n\n    // 編集ボタン\n    const editBtn = e.target.closest(\".edit-btn\");\n    if (editBtn) {\n      const id = editBtn.dataset.id;\n      const rows = await window.aivicApi.list(0);\n      if (rows) {\n        const record = rows.find(r => r.id === id);\n        if (record) {\n          container.querySelector(\"#edit-id\").value = record.id;\n          container.querySelector(\"#customer-select\").value = record.顧客名 || record.customerName || '';\n          container.querySelector(\"#product-select\").value = record.製品名 || record.productName || '';\n          container.querySelector(\"#quantity-input\").value = record.数量 || record.quantity || '';\n          container.querySelector(\"#delivery-date\").value = record.希望納期 || record.deliveryDate || '';\n          container.querySelector(\"#status-select\").value = record.ステータス || record.status || '';\n          container.querySelector(\"#sales-select\").value = record.担当営業 || record.salesPerson || '';\n          container.querySelector(\"#notes-input\").value = record.備考 || record.notes || '';\n        }\n      }\n      return;\n    }\n\n    // 行クリック（詳細表示）\n    const row = e.target.closest(\"tr[data-id]\");\n    if (row && !e.target.closest(\"button\")) {\n      const id = row.dataset.id;\n      const rows = await window.aivicApi.list(0);\n      if (rows) {\n        const record = rows.find(r => r.id === id);\n        if (record) {\n          container.querySelector(\"#edit-id\").value = record.id;\n          container.querySelector(\"#customer-select\").value = record.顧客名 || record.customerName || '';\n          container.querySelector(\"#product-select\").value = record.製品名 || record.productName || '';\n          container.querySelector(\"#quantity-input\").value = record.数量 || record.quantity || '';\n          container.querySelector(\"#delivery-date\").value = record.希望納期 || record.deliveryDate || '';\n          container.querySelector(\"#status-select\").value = record.ステータス || record.status || '';\n          container.querySelector(\"#sales-select\").value = record.担当営業 || record.salesPerson || '';\n          container.querySelector(\"#notes-input\").value = record.備考 || record.notes || '';\n        }\n      }\n    }\n  });\n\n  // 7. CSVエクスポート\n  container.querySelector(\"#btn-export\").addEventListener(\"click\", async () => {\n    const rows = await window.aivicApi.list(0);\n    if (rows && rows.length > 0) {\n      const headers = [\"要求ID\", \"顧客名\", \"製品名\", \"数量\", \"希望納期\", \"ステータス\", \"担当営業\", \"備考\"];\n      const csvContent = [\n        headers.join(\",\"),\n        ...rows.map(r => [\n          r.要求ID || r.id || '',\n          r.顧客名 || r.customerName || '',\n          r.製品名 || r.productName || '',\n          r.数量 || r.quantity || '',\n          r.希望納期 || r.deliveryDate || '',\n          r.ステータス || r.status || '',\n          r.担当営業 || r.salesPerson || '',\n          (r.備考 || r.notes || '').replace(/,/g, '，')\n        ].map(field => `\"${field}\"`).join(\",\"))\n      ].join(\"\\n\");\n      \n      const blob = new Blob([\"\\uFEFF\" + csvContent], { type: \"text/csv;charset=utf-8;\" });\n      const link = document.createElement(\"a\");\n      link.href = URL.createObjectURL(blob);\n      link.download = `顧客要求一覧_${new Date().toISOString().split('T')[0]}.csv`;\n      link.click();\n    }\n  });\n\n  // 8. アクションボタン\n  container.querySelector(\"#btn-quote\").addEventListener(\"click\", () => {\n    window.showScreen(\"scr-1780996206790\"); // 納期回答作成画面\n  });\n\n  container.querySelector(\"#btn-competitor-price\").addEventListener(\"click\", () => {\n    window.showScreen(\"scr-1780996176503\"); // 競合価格統合分析・最適価格算出画面\n  });\n\n  container.querySelector(\"#btn-price-history\").addEventListener(\"click\", () => {\n    window.showScreen(\"scr-1780996166162\"); // 価格推移・利益率分析画面\n  });\n\n  container.querySelector(\"#btn-new-request\").addEventListener(\"click\", () => {\n    container.querySelector(\"#request-form\").reset();\n    container.querySelector(\"#edit-id\").value = \"\";\n  });\n\n  // 顧客・製品選択肢を動的に設定\n  const customerSelect = container.querySelector(\"#customer-select\");\n  const productSelect = container.querySelector(\"#product-select\");\n  \n  // 顧客データがある場合は選択肢を追加\n  if (tables[3]?.records) { // 顧客テーブル\n    tables[3].records.forEach(customer => {\n      const option = document.createElement(\"option\");\n      option.value = customer.顧客名 || customer.customerName || '';\n      option.textContent = customer.顧客名 || customer.customerName || '';\n      customerSelect.appendChild(option);\n    });\n  }\n\n  // 製品データがある場合は選択肢を追加\n  if (tables[4]?.records) { // 製品テーブル\n    tables[4].records.forEach(product => {\n      const option = document.createElement(\"option\");\n      option.value = product.製品名 || product.productName || '';\n      option.textContent = product.製品名 || product.productName || '';\n      productSelect.appendChild(option);\n    });\n  }\n}";
</script>

              <th style="padding: 8px 12px; text-align: left; color: var(--text); border-bottom: 1px solid var(--border); font-weight: 500;">ステータス</th>
              <th style="padding: 8px 12px; text-align: left; color: var(--text); border-bottom: 1px solid var(--border); font-weight: 500;">担当営業</th>
              <th style="padding: 8px 12px; text-align: left; color: var(--text); border-bottom: 1px solid var(--border); font-weight: 500;">操作</th>
            </tr>
          </thead>
          <tbody id="request-tbody" data-testid="request-tbody">
          </tbody>
        </table>
      </div>
    </div>

    <!-- 右側：詳細・編集エリア -->
    <div class="card" style="padding: 16px; background: var(--bg-card); border-radius: 8px; display: flex; flex-direction: column;">
      <h3 style="margin: 0 0 16px 0; font-size: 16px; color: var(--text); font-weight: 600;">要求詳細・編集</h3>
      
      <form id="request-form" style="flex: 1; display: flex; flex-direction: column; gap: 12px;">
        <input type="hidden" id="edit-id" data-testid="edit-id">
        
        <div>
          <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">顧客</label>
          <select id="customer-select" data-testid="customer-select" required
                  style="width: 100%; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; background: rgba(0,0,0,0.25); color: var(--text); font-size: 14px;">
            <option value="">選択してください</option>
            <option value="株式会社アルファ">株式会社アルファ</option>
            <option value="ベータ工業">ベータ工業</option>
            <option value="ガンマ商事">ガンマ商事</option>
            <option value="デルタ製作所">デルタ製作所</option>
          </select>
        </div>

        <div>
          <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">製品</label>
          <select id="product-select" data-testid="product-select" required
                  style="width: 100%; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; background: rgba(0,0,0,0.25); color: var(--text); font-size: 14px;">
            <option value="">選択してください</option>
            <option value="製品A">製品A</option>
            <option value="製品B">製品B</option>
            <option value="製品C">製品C</option>
            <option value="製品D">製品D</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div>
            <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">数量</label>
            <input type="number" id="quantity-input" data-testid="quantity-input" required min="1"
                   style="width: 100%; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; background: rgba(0,0,0,0.25); color: var(--text); font-size: 14px;">
          </div>
          <div>
            <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">希望納期</label>
            <input type="date" id="delivery-date" data-testid="delivery-date" required
                   style="width: 100%; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; background: rgba(0,0,0,0.25); color: var(--text); font-size: 14px;">
          </div>
        </div>

        <div>
          <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">ステータス</label>
          <select id="status-select" data-testid="status-select" required
                  style="width: 100%; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; background: rgba(0,0,0,0.25); color: var(--text); font-size: 14px;">
            <option value="">選択してください</option>
            <option value="新規">新規</option>
            <option value="検討中">検討中</option>
            <option value="見積済み">見積済み</option>
            <option value="受注">受注</option>
            <option value="失注">失注</option>
          </select>
        </div>

        <div>
          <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">担当営業</label>
          <select id="sales-select" data-testid="sales-select" required
                  style="width: 100%; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; background: rgba(0,0,0,0.25); color: var(--text); font-size: 14px;">
            <option value="">選択してください</option>
            <option value="田中太郎">田中太郎</option>
            <option value="佐藤花子">佐藤花子</option>
            <option value="山田次郎">山田次郎</option>
          </select>
        </div>

        <div>
          <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">備考</label>
          <textarea id="notes-input" data-testid="notes-input" rows="3"
                    style="width: 100%; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; background: rgba(0,0,0,0.25); color: var(--text); font-size: 14px; resize: vertical;"></textarea>
        </div>

        <div style="margin-top: auto; display: flex; gap: 8px;">
          <button type="submit" id="btn-save" data-testid="save-button" class="action-btn" 
                  style="flex: 1; padding: 10px; background: var(--primary); color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer;">
            保存
          </button>
          <button type="button" id="btn-clear" data-testid="clear-button" class="action-btn secondary" 
                  style="padding: 10px 16px; background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; font-size: 14px; cursor: pointer;">
            クリア
          </button>
        </div>
      </form>

      <!-- アクションボタン群 -->
      <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px;">
        <button id="btn-quote" data-testid="quote-button" class="action-btn" 
                style="width: 100%; padding: 8px; background: var(--primary); color: #fff; border: none; border-radius: 4px; font-size: 13px; cursor: pointer;">
          見積作成
        </button>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <button id="btn-competitor-price" data-testid="competitor-price-button" class="action-btn secondary" 
                  style="padding: 8px; background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; font-size: 13px; cursor: pointer;">
            競合価格参照
          </button>
          <button id="btn-price-history" data-testid="price-history-button" class="action-btn secondary" 
                  style="padding: 8px; background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; font-size: 13px; cursor: pointer;">
            過去価格履歴
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
    </section>
  </main>
</div>
<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
