window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  // 1. テーブル再描画関数を定義\n  function renderRows(rows) {\n    const tbody = container.querySelector(\"#results-tbody\");\n    tbody.innerHTML = rows.map(r => {\n      const productionDate = r.生産開始日時 ? new Date(r.生産開始日時).toLocaleDateString('ja-JP') : '';\n      const qualityRate = r.生産数量 > 0 ? Math.round((r.良品数量 / r.生産数量) * 100) : 0;\n      \n      return `<tr data-id=\"${r.id}\" style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n        <td style=\"padding: 8px 12px; font-size: 13px; color: var(--text);\">${productionDate}</td>\n        <td style=\"padding: 8px 12px; font-size: 13px; color: var(--text);\">${r.生産ライン名 || ''}</td>\n        <td style=\"padding: 8px 12px; font-size: 13px; color: var(--text);\">${r.製品名 || ''}</td>\n        <td style=\"padding: 8px 12px; font-size: 13px; color: var(--text); text-align: right;\">${r.生産数量 || 0}</td>\n        <td style=\"padding: 8px 12px; font-size: 13px; color: var(--text); text-align: right;\">${r.良品数量 || 0}</td>\n        <td style=\"padding: 8px 12px; font-size: 13px; color: var(--text); text-align: right;\">${r.不良品数量 || 0}</td>\n        <td style=\"padding: 8px 12px; font-size: 13px; color: var(--text); text-align: right;\">${r.稼働率 || 0}%</td>\n        <td style=\"padding: 8px 12px; font-size: 13px; color: var(--text); text-align: right;\">${qualityRate}%</td>\n      </tr>`;\n    }).join(\"\");\n  }\n\n  // 2. KPI更新関数\n  function updateKPIs(rows) {\n    const totalProduction = rows.reduce((sum, r) => sum + (r.生産数量 || 0), 0);\n    const avgEfficiency = rows.length > 0 ? Math.round(rows.reduce((sum, r) => sum + (r.稼働率 || 0), 0) / rows.length) : 0;\n    const totalGood = rows.reduce((sum, r) => sum + (r.良品数量 || 0), 0);\n    const qualityRate = totalProduction > 0 ? Math.round((totalGood / totalProduction) * 100) : 0;\n    const defectRate = 100 - qualityRate;\n\n    container.querySelector(\"#kpi-total-production\").textContent = totalProduction.toLocaleString();\n    container.querySelector(\"#kpi-avg-efficiency\").textContent = avgEfficiency;\n    container.querySelector(\"#kpi-quality-rate\").textContent = qualityRate;\n    container.querySelector(\"#kpi-defect-rate\").textContent = defectRate;\n  }\n\n  // 3. チャート描画関数\n  function drawProductionChart(rows) {\n    const canvas = container.querySelector(\"#production-chart\");\n    const ctx = canvas.getContext(\"2d\");\n    ctx.clearRect(0, 0, canvas.width, canvas.height);\n    \n    // 日別集計\n    const dailyData = {};\n    rows.forEach(r => {\n      if (r.生産開始日時) {\n        const date = new Date(r.生産開始日時).toLocaleDateString('ja-JP');\n        dailyData[date] = (dailyData[date] || 0) + (r.生産数量 || 0);\n      }\n    });\n    \n    const dates = Object.keys(dailyData).sort();\n    const values = dates.map(d => dailyData[d]);\n    const maxValue = Math.max(...values, 1);\n    \n    // グラフ描画\n    ctx.strokeStyle = '#3b82f6';\n    ctx.lineWidth = 2;\n    ctx.beginPath();\n    \n    dates.forEach((date, i) => {\n      const x = 50 + (i * (canvas.width - 100)) / Math.max(dates.length - 1, 1);\n      const y = canvas.height - 50 - (values[i] * (canvas.height - 100)) / maxValue;\n      \n      if (i === 0) ctx.moveTo(x, y);\n      else ctx.lineTo(x, y);\n      \n      // データポイント\n      ctx.fillStyle = '#3b82f6';\n      ctx.beginPath();\n      ctx.arc(x, y, 3, 0, 2 * Math.PI);\n      ctx.fill();\n    });\n    \n    ctx.stroke();\n    \n    // 軸ラベル\n    ctx.fillStyle = '#9fb0d1';\n    ctx.font = '10px sans-serif';\n    ctx.fillText('生産量推移', 10, 20);\n  }\n\n  function drawEfficiencyMeter(efficiency) {\n    const canvas = container.querySelector(\"#efficiency-meter\");\n    const ctx = canvas.getContext(\"2d\");\n    ctx.clearRect(0, 0, canvas.width, canvas.height);\n    \n    const centerX = canvas.width / 2;\n    const centerY = canvas.height / 2;\n    const radius = 70;\n    \n    // 背景円\n    ctx.beginPath();\n    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);\n    ctx.strokeStyle = 'rgba(255,255,255,0.1)';\n    ctx.lineWidth = 10;\n    ctx.stroke();\n    \n    // 進捗円\n    const angle = (efficiency / 100) * 2 * Math.PI - Math.PI / 2;\n    ctx.beginPath();\n    ctx.arc(centerX, centerY, radius, -Math.PI / 2, angle);\n    ctx.strokeStyle = efficiency >= 80 ? '#4ade80' : efficiency >= 60 ? '#f59e0b' : '#ef4444';\n    ctx.lineWidth = 10;\n    ctx.stroke();\n    \n    // 中央テキスト\n    ctx.fillStyle = '#d0e4ff';\n    ctx.font = 'bold 24px sans-serif';\n    ctx.textAlign = 'center';\n    ctx.fillText(`${efficiency}%`, centerX, centerY + 8);\n  }\n\n  function drawQualityChart(rows) {\n    const canvas = container.querySelector(\"#quality-chart\");\n    const ctx = canvas.getContext(\"2d\");\n    ctx.clearRect(0, 0, canvas.width, canvas.height);\n    \n    const totalGood = rows.reduce((sum, r) => sum + (r.良品数量 || 0), 0);\n    const totalDefect = rows.reduce((sum, r) => sum + (r.不良品数量 || 0), 0);\n    const total = totalGood + totalDefect;\n    \n    if (total === 0) return;\n    \n    const centerX = canvas.width / 2;\n    const centerY = canvas.height / 2;\n    const radius = 60;\n    \n    // 良品（緑）\n    const goodAngle = (totalGood / total) * 2 * Math.PI;\n    ctx.beginPath();\n    ctx.moveTo(centerX, centerY);\n    ctx.arc(centerX, centerY, radius, 0, goodAngle);\n    ctx.fillStyle = '#4ade80';\n    ctx.fill();\n    \n    // 不良品（赤）\n    ctx.beginPath();\n    ctx.moveTo(centerX, centerY);\n    ctx.arc(centerX, centerY, radius, goodAngle, 2 * Math.PI);\n    ctx.fillStyle = '#ef4444';\n    ctx.fill();\n    \n    // ラベル\n    ctx.fillStyle = '#d0e4ff';\n    ctx.font = '12px sans-serif';\n    ctx.textAlign = 'left';\n    ctx.fillText(`良品: ${Math.round((totalGood/total)*100)}%`, 10, canvas.height - 30);\n    ctx.fillText(`不良: ${Math.round((totalDefect/total)*100)}%`, 10, canvas.height - 15);\n  }\n\n  function drawPlanActualChart(rows) {\n    const canvas = container.querySelector(\"#plan-actual-chart\");\n    const ctx = canvas.getContext(\"2d\");\n    ctx.clearRect(0, 0, canvas.width, canvas.height);\n    \n    // サンプルデータ（実際は生産計画テーブルと照合）\n    const planData = [1000, 1200, 800, 1500, 900];\n    const actualData = rows.slice(0, 5).map(r => r.生産数量 || 0);\n    \n    const maxValue = Math.max(...planData, ...actualData, 1);\n    const barWidth = 30;\n    const spacing = 50;\n    \n    planData.forEach((plan, i) => {\n      const x = 50 + i * spacing;\n      const actual = actualData[i] || 0;\n      \n      // 計画（青）\n      const planHeight = (plan / maxValue) * (canvas.height - 80);\n      ctx.fillStyle = '#3b82f6';\n      ctx.fillRect(x, canvas.height - 40 - planHeight, barWidth, planHeight);\n      \n      // 実績（緑）\n      const actualHeight = (actual / maxValue) * (canvas.height - 80);\n      ctx.fillStyle = '#4ade80';\n      ctx.fillRect(x + barWidth + 5, canvas.height - 40 - actualHeight, barWidth, actualHeight);\n    });\n    \n    // 凡例\n    ctx.fillStyle = '#d0e4ff';\n    ctx.font = '10px sans-serif';\n    ctx.fillText('計画', 10, 20);\n    ctx.fillText('実績', 50, 20);\n  }\n\n  // 4. 初期データ読み込みと描画\n  window.aivicApi.list(4).then(rows => {\n    if (rows) {\n      renderRows(rows);\n      updateKPIs(rows);\n      drawProductionChart(rows);\n      drawEfficiencyMeter(rows.length > 0 ? Math.round(rows.reduce((sum, r) => sum + (r.稼働率 || 0), 0) / rows.length) : 0);\n      drawQualityChart(rows);\n      drawPlanActualChart(rows);\n    }\n  });\n\n  // 5. 集計実行ボタン\n  container.querySelector(\"#btn-analyze\").addEventListener(\"click\", async () => {\n    const startDate = container.querySelector(\"#date-start\").value;\n    const endDate = container.querySelector(\"#date-end\").value;\n    const lineFilter = container.querySelector(\"#line-filter\").value;\n    const categoryFilter = container.querySelector(\"#category-filter\").value;\n    \n    const rows = await window.aivicApi.list(4);\n    if (!rows) return;\n    \n    let filteredRows = rows;\n    \n    // フィルタリング\n    if (startDate) {\n      filteredRows = filteredRows.filter(r => r.生産開始日時 && new Date(r.生産開始日時) >= new Date(startDate));\n    }\n    if (endDate) {\n      filteredRows = filteredRows.filter(r => r.生産開始日時 && new Date(r.生産開始日時) <= new Date(endDate));\n    }\n    if (lineFilter) {\n      filteredRows = filteredRows.filter(r => r.生産ライン名 && r.生産ライン名.includes(lineFilter));\n    }\n    \n    renderRows(filteredRows);\n    updateKPIs(filteredRows);\n    drawProductionChart(filteredRows);\n    drawEfficiencyMeter(filteredRows.length > 0 ? Math.round(filteredRows.reduce((sum, r) => sum + (r.稼働率 || 0), 0) / filteredRows.length) : 0);\n    drawQualityChart(filteredRows);\n    drawPlanActualChart(filteredRows);\n  });\n\n  // 6. CSVエクスポート\n  container.querySelector(\"#btn-export-csv\").addEventListener(\"click\", async () => {\n    const rows = await window.aivicApi.list(4);\n    if (!rows) return;\n    \n    const headers = [\"生産日\", \"ライン\", \"製品名\", \"生産数量\", \"良品数量\", \"不良品数量\", \"稼働率\", \"品質率\"];\n    const csvData = [headers.join(\",\")];\n    \n    rows.forEach(r => {\n      const productionDate = r.生産開始日時 ? new Date(r.生産開始日時).toLocaleDateString('ja-JP') : '';\n      const qualityRate = r.生産数量 > 0 ? Math.round((r.良品数量 / r.生産数量) * 100) : 0;\n      \n      const row = [\n        productionDate,\n        r.生産ライン名 || '',\n        r.製品名 || '',\n        r.生産数量 || 0,\n        r.良品数量 || 0,\n        r.不良品数量 || 0,\n        (r.稼働率 || 0) + '%',\n        qualityRate + '%'\n      ];\n      csvData.push(row.join(\",\"));\n    });\n    \n    const csvContent = \"\\uFEFF\" + csvData.join(\"\\n\");\n    const blob = new Blob([csvContent], { type: \"text/csv;charset=utf-8;\" });\n    const link = document.createElement(\"a\");\n    link.href = URL.createObjectURL(blob);\n    link.download = \"production_analysis_\" + new Date().toISOString().slice(0, 10) + \".csv\";\n    link.click();\n  });\n\n  // 7. 初期日付設定\n  const today = new Date();\n  const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);\n  container.querySelector(\"#date-start\").value = lastMonth.toISOString().slice(0, 10);\n  container.querySelector(\"#date-end\").value = today.toISOString().slice(0, 10);\n}";
</script>

            <th style="padding: 8px 12px; text-align: right; font-size: 12px; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border);">良品数</th>
            <th style="padding: 8px 12px; text-align: right; font-size: 12px; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border);">不良品数</th>
            <th style="padding: 8px 12px; text-align: right; font-size: 12px; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border);">稼働率</th>
            <th style="padding: 8px 12px; text-align: right; font-size: 12px; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border);">品質率</th>
          </tr>
        </thead>
        <tbody id="results-tbody">
        </tbody>
      </table>
    </div>
  </div>
</div>
    </section>
  </main>
</div>
<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
