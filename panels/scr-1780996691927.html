window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  // テーブルインデックス\n  const INVENTORY_TABLE = 4; // 棚卸データ\n  const REPORT_HISTORY_TABLE = 7; // レポート出力履歴\n  const SUPPLIER_TABLE = 1; // 仕入先マスタ\n  const PRODUCT_TABLE = 2; // 商品マスタ\n\n  // DOM要素取得\n  const generateBtn = container.querySelector('#generate-btn');\n  const progressContainer = container.querySelector('#progress-container');\n  const progressBar = container.querySelector('#progress-bar');\n  const progressText = container.querySelector('#progress-text');\n  const previewArea = container.querySelector('#preview-area');\n  const dataCount = container.querySelector('#data-count');\n  const historyTbody = container.querySelector('#history-tbody');\n  const refreshHistoryBtn = container.querySelector('#refresh-history-btn');\n\n  // 履歴テーブル再描画\n  function renderHistoryRows(rows) {\n    historyTbody.innerHTML = rows.map(row => `\n      <tr data-id=\"${row.id}\">\n        <td style=\"padding: 6px 8px; font-size: 12px; color: var(--text);\">\n          ${row.作成日時 ? new Date(row.作成日時).toLocaleString('ja-JP') : ''}\n        </td>\n        <td style=\"padding: 6px 8px; font-size: 12px; color: var(--text);\">\n          ${row.レポート名 || ''}\n        </td>\n        <td style=\"padding: 6px 8px; font-size: 12px; color: var(--text);\">\n          <span style=\"padding: 2px 6px; background: ${row.出力形式 === 'Excel' ? '#22c55e' : '#3b82f6'}; color: white; border-radius: 3px; font-size: 11px;\">\n            ${row.出力形式 || ''}\n          </span>\n        </td>\n        <td style=\"padding: 6px 8px; font-size: 12px; color: var(--text);\">\n          ${row.出力件数 || 0}件\n        </td>\n        <td style=\"padding: 6px 8px; font-size: 12px; color: var(--text);\">\n          <span style=\"padding: 2px 6px; background: ${row.出力ステータス === '成功' ? '#22c55e' : row.出力ステータス === '失敗' ? '#ef4444' : '#f59e0b'}; color: white; border-radius: 3px; font-size: 11px;\">\n            ${row.出力ステータス || ''}\n          </span>\n        </td>\n        <td style=\"padding: 6px 8px; font-size: 12px;\">\n          ${row.出力ステータス === '成功' ? `<button class=\"action-btn secondary download-btn\" data-id=\"${row.id}\" style=\"padding: 2px 6px; font-size: 11px;\">ダウンロード</button>` : ''}\n        </td>\n      </tr>\n    `).join('');\n  }\n\n  // 仕入先選択肢を動的に設定\n  function loadSuppliers() {\n    window.aivicApi.list(SUPPLIER_TABLE).then(suppliers => {\n      if (suppliers) {\n        const supplierSelect = container.querySelector('#supplier-select');\n        const currentOptions = supplierSelect.innerHTML;\n        const dynamicOptions = suppliers.filter(s => s.有効フラグ).map(s => \n          `<option value=\"${s.id}\">${s.仕入先名}</option>`\n        ).join('');\n        supplierSelect.innerHTML = currentOptions.split('</option>')[0] + '</option>' + dynamicOptions;\n      }\n    });\n  }\n\n  // 棚卸データ件数を更新\n  function updateDataCount() {\n    const startDate = container.querySelector('#start-date').value;\n    const endDate = container.querySelector('#end-date').value;\n    const supplierId = container.querySelector('#supplier-select').value;\n    const status = container.querySelector('#status-filter').value;\n\n    window.aivicApi.list(INVENTORY_TABLE).then(inventoryData => {\n      if (inventoryData) {\n        let filteredData = inventoryData;\n\n        // 期間フィルタ\n        if (startDate) {\n          filteredData = filteredData.filter(item => \n            new Date(item.棚卸日) >= new Date(startDate)\n          );\n        }\n        if (endDate) {\n          filteredData = filteredData.filter(item => \n            new Date(item.棚卸日) <= new Date(endDate)\n          );\n        }\n\n        // 仕入先フィルタ\n        if (supplierId) {\n          filteredData = filteredData.filter(item => item.仕入先ID === supplierId);\n        }\n\n        // ステータスフィルタ\n        if (status) {\n          const statusMap = {\n            'completed': '完了',\n            'pending': '実施中',\n            'approved': '承認済み'\n          };\n          filteredData = filteredData.filter(item => item.棚卸ステータス === statusMap[status]);\n        }\n\n        dataCount.textContent = `対象データ: ${filteredData.length}件`;\n      }\n    });\n  }\n\n  // プレビュー生成\n  function generatePreview(data) {\n    if (!data || data.length === 0) {\n      previewArea.innerHTML = '<div style=\"color: var(--text-muted); font-size: 13px;\">データがありません</div>';\n      return;\n    }\n\n    const previewHtml = `\n      <div style=\"padding: 12px; height: 100%; overflow-y: auto;\">\n        <div style=\"font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 12px; text-align: center;\">\n          棚卸レポート プレビュー\n        </div>\n        <table style=\"width: 100%; font-size: 11px;\">\n          <thead>\n            <tr style=\"background: rgba(255,255,255,0.1);\">\n              <th style=\"padding: 4px 6px; color: var(--text); border: 1px solid rgba(255,255,255,0.18);\">棚卸日</th>\n              <th style=\"padding: 4px 6px; color: var(--text); border: 1px solid rgba(255,255,255,0.18);\">商品名</th>\n              <th style=\"padding: 4px 6px; color: var(--text); border: 1px solid rgba(255,255,255,0.18);\">帳簿在庫</th>\n              <th style=\"padding: 4px 6px; color: var(--text); border: 1px solid rgba(255,255,255,0.18);\">実在庫</th>\n              <th style=\"padding: 4px 6px; color: var(--text); border: 1px solid rgba(255,255,255,0.18);\">差異</th>\n              <th style=\"padding: 4px 6px; color: var(--text); border: 1px solid rgba(255,255,255,0.18);\">状況</th>\n            </tr>\n          </thead>\n          <tbody>\n            ${data.slice(0, 10).map(item => `\n              <tr>\n                <td style=\"padding: 4px 6px; color: var(--text); border: 1px solid rgba(255,255,255,0.18);\">\n                  ${item.棚卸日 ? new Date(item.棚卸日).toLocaleDateString('ja-JP') : ''}\n                </td>\n                <td style=\"padding: 4px 6px; color: var(--text); border: 1px solid rgba(255,255,255,0.18);\">\n                  商品${Math.floor(Math.random() * 100) + 1}\n                </td>\n                <td style=\"padding: 4px 6px; color: var(--text); border: 1px solid rgba(255,255,255,0.18); text-align: right;\">\n                  ${item.帳簿在庫数 || 0}\n                </td>\n                <td style=\"padding: 4px 6px; color: var(--text); border: 1px solid rgba(255,255,255,0.18); text-align: right;\">\n                  ${item.実在庫数 || 0}\n                </td>\n                <td style=\"padding: 4px 6px; border: 1px solid rgba(255,255,255,0.18); text-align: right; color: ${item.差異数 > 0 ? '#22c55e' : item.差異数 < 0 ? '#ef4444' : 'var(--text)'};\">\n                  ${item.差異数 || 0}\n                </td>\n                <td style=\"padding: 4px 6px; color: var(--text); border: 1px solid rgba(255,255,255,0.18);\">\n                  ${item.棚卸ステータス || ''}\n                </td>\n              </tr>\n            `).join('')}\n          </tbody>\n        </table>\n        ${data.length > 10 ? `<div style=\"text-align: center; margin-top: 8px; color: var(--text-muted); font-size: 11px;\">他 ${data.length - 10}件...</div>` : ''}\n      </div>\n    `;\n    previewArea.innerHTML = previewHtml;\n  }\n\n  // レポート生成処理\n  function generateReport() {\n    const startDate = container.querySelector('#start-date').value;\n    const endDate = container.querySelector('#end-date').value;\n    const supplierId = container.querySelector('#supplier-select').value;\n    const status = container.querySelector('#status-filter').value;\n    const format = container.querySelector('input[name=\"format\"]:checked').value;\n\n    if (!startDate || !endDate) {\n      alert('対象期間を設定してください');\n      return;\n    }\n\n    // 進捗表示開始\n    progressContainer.style.display = 'block';\n    generateBtn.disabled = true;\n    generateBtn.textContent = '生成中...';\n\n    // 進捗アニメーション\n    let progress = 0;\n    const progressInterval = setInterval(() => {\n      progress += Math.random() * 15;\n      if (progress > 90) progress = 90;\n      progressBar.style.width = progress + '%';\n      progressText.textContent = Math.floor(progress) + '%';\n    }, 200);\n\n    // データ取得とレポート生成\n    window.aivicApi.list(INVENTORY_TABLE).then(inventoryData => {\n      if (inventoryData) {\n        // フィルタリング処理（updateDataCount と同じロジック）\n        let filteredData = inventoryData;\n        \n        if (startDate) {\n          filteredData = filteredData.filter(item => \n            new Date(item.棚卸日) >= new Date(startDate)\n          );\n        }\n        if (endDate) {\n          filteredData = filteredData.filter(item => \n            new Date(item.棚卸日) <= new Date(endDate)\n          );\n        }\n        if (supplierId) {\n          filteredData = filteredData.filter(item => item.仕入先ID === supplierId);\n        }\n        if (status) {\n          const statusMap = {\n            'completed': '完了',\n            'pending': '実施中', \n            'approved': '承認済み'\n          };\n          filteredData = filteredData.filter(item => item.棚卸ステータス === statusMap[status]);\n        }\n\n        // プレビュー生成\n        generatePreview(filteredData);\n\n        // レポート履歴に保存\n        const reportData = {\n          仕入先ID: supplierId || null,\n          レポート種別: '棚卸レポート',\n          レポート名: `棚卸レポート_${startDate}_${endDate}`,\n          出力形式: format === 'excel' ? 'Excel' : 'PDF',\n          対象期間開始日: startDate,\n          対象期間終了日: endDate,\n          出力件数: filteredData.length,\n          ファイルサイズ: Math.floor(Math.random() * 500000) + 100000,\n          出力ステータス: '成功',\n          ダウンロード回数: 0,\n          作成者ID: 'current-user-id'\n        };\n\n        window.aivicApi.save(REPORT_HISTORY_TABLE, reportData).then(() => {\n          // 進捗完了\n          clearInterval(progressInterval);\n          progressBar.style.width = '100%';\n          progressText.textContent = '100%';\n\n          setTimeout(() => {\n            progressContainer.style.display = 'none';\n            generateBtn.disabled = false;\n            generateBtn.textContent = 'レポート生成';\n            \n            // 履歴更新\n            loadReportHistory();\n          }, 1000);\n        });\n      }\n    });\n  }\n\n  // 履歴読み込み\n  function loadReportHistory() {\n    window.aivicApi.list(REPORT_HISTORY_TABLE).then(rows => {\n      if (rows) {\n        const sortedRows = rows.sort((a, b) => new Date(b.作成日時) - new Date(a.作成日時));\n        renderHistoryRows(sortedRows);\n      }\n    });\n  }\n\n  // 初期データ読み込み\n  renderHistoryRows(tables[REPORT_HISTORY_TABLE]?.records || []);\n  loadSuppliers();\n  updateDataCount();\n\n  // イベントリスナー\n  generateBtn.addEventListener('click', generateReport);\n  refreshHistoryBtn.addEventListener('click', loadReportHistory);\n\n  // 条件変更時のデータ件数更新\n  ['#start-date', '#end-date', '#supplier-select', '#status-filter'].forEach(selector => {\n    container.querySelector(selector).addEventListener('change', updateDataCount);\n  });\n\n  // カテゴリチェックボックス変更時\n  ['#category-steel', '#category-concrete', '#category-wood', '#category-electric'].forEach(selector => {\n    container.querySelector(selector).addEventListener('change', updateDataCount);\n  });\n\n  // ダウンロードボタンのイベントデリゲーション\n  container.addEventListener('click', async (e) => {\n    const downloadBtn = e.target.closest('.download-btn');\n    if (downloadBtn) {\n      const reportId = downloadBtn.dataset.id;\n      \n      // ダウンロード処理（実際のファイルダウンロードをシミュレート）\n      const link = document.createElement('a');\n      link.href = '#'; // 実際の環境ではファイルURLを設定\n      link.download = `棚卸レポート_${new Date().toISOString().split('T')[0]}.xlsx`;\n      link.click();\n\n      // ダウンロード回数を更新\n      window.aivicApi.list(REPORT_HISTORY_TABLE).then(reports => {\n        const report = reports.find(r => r.id === reportId);\n        if (report) {\n          window.aivicApi.update(REPORT_HISTORY_TABLE, reportId, {\n            ダウンロード回数: (report.ダウンロード回数 || 0) + 1,\n            最終ダウンロード日時: new Date().toISOString()\n          }).then(() => {\n            loadReportHistory();\n          });\n        }\n      });\n    }\n  });\n}";

                <th style="padding: 6px 8px; font-size: 12px; color: var(--text);">形式</th>
                <th style="padding: 6px 8px; font-size: 12px; color: var(--text);">件数</th>
                <th style="padding: 6px 8px; font-size: 12px; color: var(--text);">状況</th>
                <th style="padding: 6px 8px; font-size: 12px; color: var(--text);">操作</th>
              </tr>
            </thead>
            <tbody id="history-tbody">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
    </section>
  </main>
</div>
<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
