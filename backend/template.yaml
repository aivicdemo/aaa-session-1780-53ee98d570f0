AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  AIVIC Backend — 生産管理システム
  DynamoDB + Lambda + API Gateway

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    Environment:
      Variables:
        NODE_ENV: production

Parameters:
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name

Resources:
  # ── DynamoDB テーブル ──────────────────────────────────────────

  DynamoDBTable0:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table0"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 生産管理システム
        - Key: TableIndex
          Value: "0"
        - Key: TableName
          Value: "製品マスタ"

  DynamoDBTable1:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table1"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 生産管理システム
        - Key: TableIndex
          Value: "1"
        - Key: TableName
          Value: "製品仕様"

  DynamoDBTable2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table2"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 生産管理システム
        - Key: TableIndex
          Value: "2"
        - Key: TableName
          Value: "工程マスタ"

  DynamoDBTable3:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table3"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 生産管理システム
        - Key: TableIndex
          Value: "3"
        - Key: TableName
          Value: "製造ライン"

  DynamoDBTable4:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table4"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 生産管理システム
        - Key: TableIndex
          Value: "4"
        - Key: TableName
          Value: "生産指示書"

  DynamoDBTable5:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table5"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 生産管理システム
        - Key: TableIndex
          Value: "5"
        - Key: TableName
          Value: "生産指示書明細"

  DynamoDBTable6:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table6"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 生産管理システム
        - Key: TableIndex
          Value: "6"
        - Key: TableName
          Value: "作業実績"

  DynamoDBTable7:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table7"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 生産管理システム
        - Key: TableIndex
          Value: "7"
        - Key: TableName
          Value: "品質検査結果"

  DynamoDBTable8:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table8"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 生産管理システム
        - Key: TableIndex
          Value: "8"
        - Key: TableName
          Value: "工程引き継ぎ情報"

  DynamoDBTable9:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table9"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 生産管理システム
        - Key: TableIndex
          Value: "9"
        - Key: TableName
          Value: "標準手順書"

  DynamoDBTable10:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table10"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 生産管理システム
        - Key: TableIndex
          Value: "10"
        - Key: TableName
          Value: "品質基準"

  DynamoDBTable11:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table11"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 生産管理システム
        - Key: TableIndex
          Value: "11"
        - Key: TableName
          Value: "作業履歴"

  DynamoDBTable12:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table12"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 生産管理システム
        - Key: TableIndex
          Value: "12"
        - Key: TableName
          Value: "進捗管理"

  DynamoDBTable13:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table13"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 生産管理システム
        - Key: TableIndex
          Value: "13"
        - Key: TableName
          Value: "アラート通知"

  DynamoDBTable14:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table14"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 生産管理システム
        - Key: TableIndex
          Value: "14"
        - Key: TableName
          Value: "異常値検出ログ"

  # ── Lambda 関数 ───────────────────────────────────────────────
  AivicApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: lambda/
      Handler: handler.handler
      Description: "AIVIC CRUD API for 生産管理システム"
      Environment:
        Variables:
        AIVIC_TABLE_0: !Ref DynamoDBTable0
        AIVIC_TABLE_1: !Ref DynamoDBTable1
        AIVIC_TABLE_2: !Ref DynamoDBTable2
        AIVIC_TABLE_3: !Ref DynamoDBTable3
        AIVIC_TABLE_4: !Ref DynamoDBTable4
        AIVIC_TABLE_5: !Ref DynamoDBTable5
        AIVIC_TABLE_6: !Ref DynamoDBTable6
        AIVIC_TABLE_7: !Ref DynamoDBTable7
        AIVIC_TABLE_8: !Ref DynamoDBTable8
        AIVIC_TABLE_9: !Ref DynamoDBTable9
        AIVIC_TABLE_10: !Ref DynamoDBTable10
        AIVIC_TABLE_11: !Ref DynamoDBTable11
        AIVIC_TABLE_12: !Ref DynamoDBTable12
        AIVIC_TABLE_13: !Ref DynamoDBTable13
        AIVIC_TABLE_14: !Ref DynamoDBTable14
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
                - dynamodb:Query
              Resource:
            - !GetAtt DynamoDBTable0.Arn
            - !GetAtt DynamoDBTable1.Arn
            - !GetAtt DynamoDBTable2.Arn
            - !GetAtt DynamoDBTable3.Arn
            - !GetAtt DynamoDBTable4.Arn
            - !GetAtt DynamoDBTable5.Arn
            - !GetAtt DynamoDBTable6.Arn
            - !GetAtt DynamoDBTable7.Arn
            - !GetAtt DynamoDBTable8.Arn
            - !GetAtt DynamoDBTable9.Arn
            - !GetAtt DynamoDBTable10.Arn
            - !GetAtt DynamoDBTable11.Arn
            - !GetAtt DynamoDBTable12.Arn
            - !GetAtt DynamoDBTable13.Arn
            - !GetAtt DynamoDBTable14.Arn
      Events:
        ApiRoot:
          Type: Api
          Properties:
            RestApiId: !Ref AivicApi
            Path: /api/{tableIndex}
            Method: ANY
        ApiItem:
          Type: Api
          Properties:
            RestApiId: !Ref AivicApi
            Path: /api/{tableIndex}/{id}
            Method: ANY
        ApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref AivicApi
            Path: /api/{proxy+}
            Method: OPTIONS

  # ── API Gateway ───────────────────────────────────────────────
  AivicApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: !Ref StageName
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"

Outputs:
  ApiBaseUrl:
    Description: "API Gateway base URL (config.js に設定してください)"
    Value: !Sub "https://${AivicApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"

  Table0Name:
    Description: "DynamoDB table name for 製品マスタ"
    Value: !Ref DynamoDBTable0

  Table1Name:
    Description: "DynamoDB table name for 製品仕様"
    Value: !Ref DynamoDBTable1

  Table2Name:
    Description: "DynamoDB table name for 工程マスタ"
    Value: !Ref DynamoDBTable2

  Table3Name:
    Description: "DynamoDB table name for 製造ライン"
    Value: !Ref DynamoDBTable3

  Table4Name:
    Description: "DynamoDB table name for 生産指示書"
    Value: !Ref DynamoDBTable4

  Table5Name:
    Description: "DynamoDB table name for 生産指示書明細"
    Value: !Ref DynamoDBTable5

  Table6Name:
    Description: "DynamoDB table name for 作業実績"
    Value: !Ref DynamoDBTable6

  Table7Name:
    Description: "DynamoDB table name for 品質検査結果"
    Value: !Ref DynamoDBTable7

  Table8Name:
    Description: "DynamoDB table name for 工程引き継ぎ情報"
    Value: !Ref DynamoDBTable8

  Table9Name:
    Description: "DynamoDB table name for 標準手順書"
    Value: !Ref DynamoDBTable9

  Table10Name:
    Description: "DynamoDB table name for 品質基準"
    Value: !Ref DynamoDBTable10

  Table11Name:
    Description: "DynamoDB table name for 作業履歴"
    Value: !Ref DynamoDBTable11

  Table12Name:
    Description: "DynamoDB table name for 進捗管理"
    Value: !Ref DynamoDBTable12

  Table13Name:
    Description: "DynamoDB table name for アラート通知"
    Value: !Ref DynamoDBTable13

  Table14Name:
    Description: "DynamoDB table name for 異常値検出ログ"
    Value: !Ref DynamoDBTable14
