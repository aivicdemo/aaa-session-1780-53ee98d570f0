window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const tbody = container.querySelector(\"#order-tbody\");\n  let currentOrderId = null;\n  let allOrders = [];\n\n  // ステータスバッジのスタイル取得\n  function getStatusBadge(status) {\n    const statusStyles = {\n      '受注確定': 'bg-blue-500 text-white',\n      '製造中': 'bg-yellow-500 text-white',\n      '出荷済み': 'bg-green-500 text-white',\n      '完了': 'bg-gray-500 text-white',\n      'キャンセル': 'bg-red-500 text-white'\n    };\n    const style = statusStyles[status] || 'bg-gray-400 text-white';\n    return `<span class=\"px-2 py-1 rounded text-xs font-medium ${style}\">${status || ''}</span>`;\n  }\n\n  // 金額フォーマット\n  function formatAmount(amount) {\n    if (!amount) return '¥0';\n    return '¥' + parseInt(amount).toLocaleString();\n  }\n\n  // 日付フォーマット\n  function formatDate(dateStr) {\n    if (!dateStr) return '';\n    const date = new Date(dateStr);\n    return date.toLocaleDateString('ja-JP');\n  }\n\n  // 1. テーブル再描画関数\n  function renderRows(rows) {\n    allOrders = rows;\n    tbody.innerHTML = rows.map(r => `\n      <tr data-id=\"${r.id}\" class=\"border-b border-[rgba(255,255,255,0.08)] hover:bg-[rgba(255,255,255,0.03)] cursor-pointer\">\n        <td class=\"px-4 py-3 text-sm text-[var(--text)] font-medium\">${r.受注番号 || ''}</td>\n        <td class=\"px-4 py-3 text-sm text-[var(--text)]\">${r.顧客名 || ''}</td>\n        <td class=\"px-4 py-3 text-sm text-[var(--text)]\">${formatDate(r.受注日)}</td>\n        <td class=\"px-4 py-3 text-sm text-[var(--text)]\">${formatDate(r.納期)}</td>\n        <td class=\"px-4 py-3 text-sm text-[var(--text)] text-right font-medium\">${formatAmount(r.受注金額)}</td>\n        <td class=\"px-4 py-3 text-center\">${getStatusBadge(r.受注ステータス)}</td>\n        <td class=\"px-4 py-3 text-center\">\n          <button class=\"action-btn secondary view-detail-btn text-xs\" data-id=\"${r.id}\">詳細</button>\n        </td>\n      </tr>\n    `).join(\"\");\n  }\n\n  // 2. 初期データ描画\n  renderRows(tables[4]?.records || []);\n\n  // 検索フィルタ関数\n  function filterOrders() {\n    const orderNumber = container.querySelector(\"#order-number-search\").value.toLowerCase();\n    const customerName = container.querySelector(\"#customer-name-search\").value.toLowerCase();\n    const dateFrom = container.querySelector(\"#order-date-from\").value;\n    const dateTo = container.querySelector(\"#order-date-to\").value;\n    const status = container.querySelector(\"#order-status-filter\").value;\n\n    let filtered = allOrders.filter(order => {\n      // 受注番号フィルタ\n      if (orderNumber && !(order.受注番号 || '').toLowerCase().includes(orderNumber)) {\n        return false;\n      }\n      \n      // 顧客名フィルタ\n      if (customerName && !(order.顧客名 || '').toLowerCase().includes(customerName)) {\n        return false;\n      }\n      \n      // 受注日フィルタ\n      if (dateFrom || dateTo) {\n        const orderDate = new Date(order.受注日);\n        if (dateFrom && orderDate < new Date(dateFrom)) return false;\n        if (dateTo && orderDate > new Date(dateTo)) return false;\n      }\n      \n      // ステータスフィルタ\n      if (status && order.受注ステータス !== status) {\n        return false;\n      }\n      \n      return true;\n    });\n\n    renderRows(filtered);\n  }\n\n  // 詳細表示関数\n  function showOrderDetail(orderId) {\n    const order = allOrders.find(o => o.id === orderId);\n    if (!order) return;\n\n    currentOrderId = orderId;\n    \n    container.querySelector(\"#detail-order-number\").textContent = order.受注番号 || '';\n    container.querySelector(\"#detail-customer-name\").textContent = order.顧客名 || '';\n    container.querySelector(\"#detail-sales-rep\").textContent = order.担当営業名 || '';\n    container.querySelector(\"#detail-order-date\").textContent = formatDate(order.受注日);\n    container.querySelector(\"#detail-delivery-date\").textContent = formatDate(order.納期);\n    container.querySelector(\"#detail-order-amount\").textContent = formatAmount(order.受注金額);\n    container.querySelector(\"#detail-notes\").textContent = order.備考 || '';\n    \n    container.querySelector(\"#order-detail-panel\").style.display = \"block\";\n  }\n\n  // CSVエクスポート関数\n  function exportToCSV() {\n    const headers = ['受注番号', '顧客名', '受注日', '納期', '受注金額', '受注ステータス', '担当営業', '備考'];\n    const csvContent = '\\uFEFF' + [\n      headers.join(','),\n      ...allOrders.map(order => [\n        `\"${order.受注番号 || ''}\"`,\n        `\"${order.顧客名 || ''}\"`,\n        `\"${formatDate(order.受注日)}\"`,\n        `\"${formatDate(order.納期)}\"`,\n        `\"${order.受注金額 || 0}\"`,\n        `\"${order.受注ステータス || ''}\"`,\n        `\"${order.担当営業名 || ''}\"`,\n        `\"${(order.備考 || '').replace(/\"/g, '\"\"')}\"`\n      ].join(','))\n    ].join('\\n');\n\n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `受注一覧_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  }\n\n  // 3. 検索ボタンイベント\n  container.querySelector(\"#btn-search\").addEventListener(\"click\", async () => {\n    const rows = await window.aivicApi.list(4);\n    if (rows) {\n      allOrders = rows;\n      filterOrders();\n    }\n  });\n\n  // クリアボタンイベント\n  container.querySelector(\"#btn-clear\").addEventListener(\"click\", () => {\n    container.querySelector(\"#order-number-search\").value = '';\n    container.querySelector(\"#customer-name-search\").value = '';\n    container.querySelector(\"#order-date-from\").value = '';\n    container.querySelector(\"#order-date-to\").value = '';\n    container.querySelector(\"#order-status-filter\").value = '';\n    renderRows(allOrders);\n  });\n\n  // CSVエクスポートボタンイベント\n  container.querySelector(\"#btn-export\").addEventListener(\"click\", exportToCSV);\n\n  // 新規受注登録ボタンイベント\n  container.querySelector(\"#btn-new-order\").addEventListener(\"click\", () => {\n    window.showScreen(\"scr-1780996145775\");\n  });\n\n  // 詳細パネル閉じるボタン\n  container.querySelector(\"#btn-close-detail\").addEventListener(\"click\", () => {\n    container.querySelector(\"#order-detail-panel\").style.display = \"none\";\n    currentOrderId = null;\n  });\n\n  // 編集ボタンイベント\n  container.querySelector(\"#btn-edit-order\").addEventListener(\"click\", () => {\n    if (currentOrderId) {\n      window.showScreen(\"scr-1780996145775\");\n    }\n  });\n\n  // 履歴分析ボタンイベント\n  container.querySelector(\"#btn-view-history\").addEventListener(\"click\", () => {\n    window.showScreen(\"scr-1780996155972\");\n  });\n\n  // 価格分析ボタンイベント\n  container.querySelector(\"#btn-price-analysis\").addEventListener(\"click\", () => {\n    window.showScreen(\"scr-1780996166162\");\n  });\n\n  // 5. イベントデリゲーション（行クリック・詳細ボタン）\n  container.addEventListener(\"click\", (e) => {\n    // 詳細ボタンクリック\n    const detailBtn = e.target.closest(\".view-detail-btn\");\n    if (detailBtn) {\n      e.stopPropagation();\n      showOrderDetail(detailBtn.dataset.id);\n      return;\n    }\n\n    // 行クリック\n    const row = e.target.closest(\"tr[data-id]\");\n    if (row && row.dataset.id) {\n      showOrderDetail(row.dataset.id);\n    }\n  });\n\n  // 検索フィールドでのEnterキー対応\n  ['order-number-search', 'customer-name-search'].forEach(id => {\n    container.querySelector(`#${id}`).addEventListener('keypress', (e) => {\n      if (e.key === 'Enter') {\n        filterOrders();\n      }\n    });\n  });\n\n  // 日付・ステータス変更時の自動フィルタ\n  ['order-date-from', 'order-date-to', 'order-status-filter'].forEach(id => {\n    container.querySelector(`#${id}`).addEventListener('change', filterOrders);\n  });\n\n  // 初期データロード\n  window.aivicApi.list(4).then(rows => {\n    if (rows) {\n      renderRows(rows);\n    }\n  });\n}";
</script>

          <div id="detail-order-date" class="text-[var(--text)]"></div>
        </div>
        <div>
          <label class="block text-sm text-[var(--text-muted)] mb-1">納期</label>
          <div id="detail-delivery-date" class="text-[var(--text)]"></div>
        </div>
        <div>
          <label class="block text-sm text-[var(--text-muted)] mb-1">受注金額</label>
          <div id="detail-order-amount" class="text-[var(--text)] font-medium"></div>
        </div>
        <div class="col-span-3">
          <label class="block text-sm text-[var(--text-muted)] mb-1">備考</label>
          <div id="detail-notes" class="text-[var(--text)] bg-[rgba(0,0,0,0.15)] p-3 rounded min-h-[60px]"></div>
        </div>
      </div>
      
      <div class="flex gap-2 mt-6">
        <button id="btn-edit-order" data-testid="edit-order-button"
                class="bg-[var(--primary)] text-white px-4 py-2 rounded text-sm font-medium hover:bg-[var(--primary-hover)]">
          編集
        </button>
        <button id="btn-view-history" data-testid="view-history-button"
                class="bg-transparent border border-[rgba(255,255,255,0.18)] text-[var(--text)] px-4 py-2 rounded text-sm hover:bg-[rgba(255,255,255,0.05)]">
          履歴分析
        </button>
        <button id="btn-price-analysis" data-testid="price-analysis-button"
                class="bg-transparent border border-[rgba(255,255,255,0.18)] text-[var(--text)] px-4 py-2 rounded text-sm hover:bg-[rgba(255,255,255,0.05)]">
          価格分析
        </button>
      </div>
    </div>
  </div>
</div>
    </section>
  </main>
</div>
<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
